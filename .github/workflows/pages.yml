name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: playground

      - uses: actions/checkout@v4
        with:
          repository: actcore/web-runtime
          path: web-runtime

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # web-runtime fetches its WIT deps with wkg (wit/deps is gitignored,
      # pinned by wkg.lock). Install the prebuilt binary — no Rust needed.
      - name: Install wkg
        run: |
          curl -fsSL https://github.com/bytecodealliance/wasm-pkg-tools/releases/download/v0.15.1/wkg-x86_64-unknown-linux-gnu -o "$RUNNER_TEMP/wkg"
          chmod +x "$RUNNER_TEMP/wkg"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build @actcore/web-runtime
        working-directory: web-runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run sync-wit
          npm run build

      - name: Install playground deps (resolves @actcore/web-runtime via file:../web-runtime)
        working-directory: playground
        run: npm install

      - name: Build playground
        working-directory: playground
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
